<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Menu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
        }
        table {
            width: 60%;
            margin: 0 auto;
            border-collapse: separate;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        caption {
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
            background-color: #ffebcc;
            border: 1px solid #b3b3b3;
            border-bottom: none;
            color: #b33c00;
        }
        th {
            background-color: #cce6ff;
            color: #333;
            font-weight: bold;
        }
        th, td {
            border: 1px solid #b3b3b3;
            text-align: center;
        }
        /* Specific row styling matching the image colors */
        .header-category {
            background-color: #b3e6cc;
        }
        .header-item {
            background-color: #ffffcc;
        }
        .header-price {
            background-color: #e6f2ff;
        }
        .cat-starters {
            background-color: #ffccb3;
            font-weight: bold;
            color: #b33c00;
        }
        .cat-main {
            background-color: #ccffcc;
            font-weight: bold;
            color: #006622;
        }
        .cat-desserts {
            background-color: #ffb3b3;
            font-weight: bold;
            color: #990000;
        }
        .cat-drinks {
            background-color: #b3e6cc;
            font-weight: bold;
            color: #004d33;
        }
        /* Alignment fixes for food items */
        .food-item {
            text-align: left;
            padding-left: 15px;
        }
    </style>
</head>
<body>

    <table border="1" cellpadding="8" cellspacing="0" align="center">
        <caption>Today's Special Menu</caption>
        <thead>
            <tr>
                <th width="30%" class="header-category">Category</th>
                <th width="45%" class="header-item">Food Item</th>
                <th width="25%" class="header-price">Price (₹)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Starters -->
            <tr>
                <td rowspan="3" class="cat-starters">Starters</td>
                <td class="food-item">Spring Rolls</td>
                <td>120</td>
            </tr>
            <tr>
                <td class="food-item">Garlic Bread</td>
                <td>100</td>
            </tr>
            <tr>
                <td class="food-item">Veg Soup</td>
                <td>80</td>
            </tr>

            <!-- Main Course -->
            <tr>
                <td rowspan="3" class="cat-main">Main Course</td>
                <td class="food-item">Paneer Butter Masala</td>
                <td>180</td>
            </tr>
            <tr>
                <td class="food-item">Veg Biryani</td>
                <td>150</td>
            </tr>
            <tr>
                <td class="food-item">Dal Tadka</td>
                <td>120</td>
            </tr>

            <!-- Desserts -->
            <tr>
                <td rowspan="3" class="cat-desserts">Desserts</td>
                <td class="food-item">Chocolate Cake</td>
                <td>90</td>
            </tr>
            <tr>
                <td class="food-item">Ice Cream</td>
                <td>70</td>
            </tr>
            <tr>
                <td class="food-item">Gulab Jamun</td>
                <td>60</td>
            </tr>

            <!-- Drinks -->
            <tr>
                <td rowspan="3" class="cat-drinks">Drinks</td>
                <td class="food-item">Fresh Lime Soda</td>
                <td>50</td>
            </tr>
            <tr>
                <td class="food-item">Cold Coffee</td>
                <td>80</td>
            </tr>
            <tr>
                <td class="food-item">Mango Shake</td>
                <td>70</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
