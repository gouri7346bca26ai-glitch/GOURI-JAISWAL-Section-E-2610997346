<!DOCTYPE html>
<html>
<head>
    <title>Hotel Booking</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #fcfcfc; padding: 20px;">

    <table border="1" cellpadding="8" cellspacing="0" width="600" style="border-collapse: collapse; border: 2px solid #ed7d31;">
        <!-- Header Banner -->
        <tr>
            <th colspan="2" bgcolor="#ed7d31" style="color: white; font-size: 18px; padding: 12px; text-align: left;">
                Hotel Booking (Nested Table)
            </th>
        </tr>
        <tr>
            <th align="left" bgcolor="#fce4d6" width="30%">Guest Name</th>
            <td>Simran Kaur</td>
        </tr>
        <tr>
            <th align="left" bgcolor="#fce4d6">Booking ID</th>
            <td>HBK7890</td>
        </tr>
        <tr>
            <th align="left" bgcolor="#fce4d6">Room Type</th>
            <td>Deluxe Room</td>
        </tr>

        <!-- Booking Calculations Nested Table -->
        <tr>
            <th align="left" bgcolor="#fce4d6" valign="middle">Booking Details</th>
            <td style="padding: 0;">
                <table border="1" cellpadding="8" cellspacing="0" width="100%" style="border-collapse: collapse; border: none;">
                    <tr bgcolor="#ed7d31" style="color: white;">
                        <th>Check-in Date</th>
                        <th>Check-out Date</th>
                        <th>Guests</th>
                        <th>Charges</th>
                    </tr>
                    <tr>
                        <td align="center">15-10-2025</td>
                        <td align="center">18-10-2025</td>
                        <td align="right">2</td>
                        <td align="right">₹7,500</td>
                    </tr>
                    <tr bgcolor="#fce4d6">
                        <th colspan="3" align="right">Total Charges</th>
                        <th align="right" style="color: #c55a11;">₹7,500</th>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
