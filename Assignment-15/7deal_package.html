<!DOCTYPE html>
<html>
<head>
    <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background-color: #ffffff;
      padding: 20px 15px;
      margin: 0;
    }
    h3 {
      color: #e11d48; /* Warm modern coral/red */
      border-bottom: 2px solid #ffe4e6;
      padding-bottom: 8px;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 16px;
    }
    .pkg {
      background: #ffffff;
      margin-bottom: 15px;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
      /* Soft modern shadow layer */
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); 
    }
    .title {
      font-weight: 700;
      color: #1e293b;
      font-size: 13px;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    p {
      margin: 0;
      color: #64748b;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
    <h3>Travel Packages</h3>
    
    <div class="pkg">
        <div class="title">BUDGET PACKAGE</div>
        <p>Affordable stays and essential sightseeing tours.</p>
    </div>
    
    <div class="pkg">
        <div class="title">FAMILY PACKAGE</div>
        <p>Kid-friendly itineraries and relaxed resort stays.</p>
    </div>
    
    <div class="pkg">
        <div class="title">ADVENTURE PACKAGE</div>
        <p>Includes trekking, river rafting, and camping guides.</p>
    </div>
</body>
</html>
